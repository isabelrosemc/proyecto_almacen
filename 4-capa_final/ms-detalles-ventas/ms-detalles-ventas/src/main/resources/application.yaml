server:
  port: 8089

spring:
  application:
    name: ms-detalle-ventas

  datasource:
    url: jdbc:mysql://localhost:3307/detalle_ventas_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka