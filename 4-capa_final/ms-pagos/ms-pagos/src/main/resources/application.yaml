server:
  port: 8091

spring:
  application:
    name: ms-pagos

  datasource:
    url: jdbc:mysql://localhost:3307/pagos_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html