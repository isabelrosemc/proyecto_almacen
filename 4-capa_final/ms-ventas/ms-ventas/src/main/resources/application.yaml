server:
  port: 8087

spring:
  application:
    name: ms-ventas

  datasource:
    url: jdbc:mysql://localhost:3306/db_ventas
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.almacen.ms_ventas: DEBUG