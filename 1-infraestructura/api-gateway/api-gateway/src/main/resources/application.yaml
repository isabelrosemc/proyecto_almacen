server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: ms-ventas
              uri: lb://ms-ventas
              predicates:
                - Path=/api/ventas/**

            - id: ms-compras
              uri: lb://ms-compras
              predicates:
                - Path=/api/compras/**

            - id: ms-stock
              uri: lb://ms-stock
              predicates:
                - Path=/api/stock/**

            - id: ms-categorias
              uri: lb://ms-categorias
              predicates:
                - Path=/api/categorias/**

            - id: ms-clientes
              uri: lb://ms-clientes
              predicates:
                - Path=/api/clientes/**

            - id: ms-proveedores
              uri: lb://ms-proveedores
              predicates:
                - Path=/api/proveedores/**

            - id: ms-productos
              uri: lb://ms-productos
              predicates:
                - Path=/api/productos/**

            - id: ms-usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/usuarios/**

            - id: ms-auth
              uri: lb://ms-auth
              predicates:
                - Path=/api/auth/**

            - id: ms-detalles-ventas
              uri: lb://ms-detalles-ventas
              predicates:
                - Path=/api/detalles-ventas/**

            - id: ms-pagos
              uri: lb://ms-pagos
              predicates:
                - Path=/api/pagos/**

            - id: ms-reportes
              uri: lb://ms-reportes
              predicates:
                - Path=/api/reportes/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka