server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: ms-categorias
          uri: lb://ms-categorias
          predicates:
            - Path=/api/categorias/**

        - id: ms-clientes
          uri: lb://ms-clientes
          predicates:
            - Path=/api/clientes/**

        - id: ms-proveedores
          uri: lb://ms-proveedores
          predicates:
            - Path=/api/proveedores/**

        - id: ms-productos
          uri: lb://ms-productos
          predicates:
            - Path=/api/productos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka