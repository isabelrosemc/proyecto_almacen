server:
  port: 8083

spring:
  application:
    name: ms-proveedores

  datasource:
    url: jdbc:mysql://localhost:3306/db_proveedores
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    com.ms.proveedores: DEBUG